[project]
name = "video-trans"
version = "0.1.0"
description = "Subtitle, translate and dub videos locally"
requires-python = ">=3.10"
dependencies = ["cactus-needle", "av", "numpy", "srt", "soundfile", "pydantic>=2", "pyyaml"]

[project.optional-dependencies]
local = ["ctranslate2", "transformers", "sentencepiece", "protobuf"]
openai = ["openai"]
# onnxruntime ≥ 1.31 refuses to load the model from the Hugging Face cache ("External data path escapes model directory")
tts = ["vieneu", "onnxruntime==1.23.2"]
ui = ["fastapi[standard]>=0.135"]
url = ["yt-dlp"]
experiments = ["moondream"]

[project.scripts]
video-trans = "dich.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dich*"]

[tool.setuptools.package-data]
dich = ["templates/*.yaml"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
