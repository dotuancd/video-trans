name: dub-review
title: Lồng tiếng, duyệt bản dịch trước
description: Như đầy đủ, nhưng dừng trước bước lồng tiếng để sửa bản dịch và nghe thử giọng.
stages:
  - {stage: source,    driver: auto}
  - {stage: separate,  driver: demucs, enabled: false}
  - {stage: asr,       driver: needle}
  - {stage: refine,    driver: rules, enabled: false}
  - {stage: brief,     driver: llm}             # what the video is about, for the translation
  - {stage: translate, driver: env}
  - {stage: dub,       driver: vieneu, gate: review}
  - {stage: mux,       driver: ffmpeg}
  - {stage: mindmap,   driver: llm, enabled: false}   # what the video says, part by part (Tạo mindmap)
